<style>
  :root {
    --cream: #faf7f2;
    --warm-white: #fff9f4;
    --bark: #3d2b1f;
    --bark-light: #5c4033;
    --sage: #7a9e7e;
    --sage-dark: #5a7d5e;
    --terracotta: #c4714a;
    --terracotta-light: #e8a07e;
    --gold: #d4a84b;
    --gold-light: #f0cc7a;
    --sky: #6a9ab0;
    --sky-light: #a8cad9;
    --blush: #d4847a;
    --blush-light: #ead5d2;
    --text: #2a1f16;
    --text-soft: #7a6a5e;
    --border: rgba(61,43,31,0.12);
    --shadow: 0 4px 24px rgba(61,43,31,0.1);
    --shadow-lg: 0 12px 40px rgba(61,43,31,0.15);
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
  }

  /* ── Header ── */
  .header {
    background: var(--bark);
    padding: 20px 20px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.2);
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .app-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: var(--gold-light);
    letter-spacing: 1px;
  }
  .app-subtitle {
    font-size: 11px;
    color: rgba(255,249,244,0.5);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 1px;
  }

  /* User selector */
  .user-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,249,244,0.1);
    border: 1px solid rgba(255,249,244,0.2);
    border-radius: 40px;
    padding: 6px 14px 6px 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .user-pill:hover { background: rgba(255,249,244,0.18); }
  .user-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
    color: var(--bark);
  }
  .user-name { color: var(--cream); font-size: 13px; font-weight: 500; }
  .chevron { color: rgba(255,249,244,0.6); font-size: 10px; }

  /* Nav tabs */
  .nav-tabs {
    display: flex;
    gap: 4px;
  }
  .nav-tab {
    flex: 1;
    padding: 10px 6px;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: rgba(255,249,244,0.5);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .nav-tab.active {
    color: var(--gold-light);
    border-bottom-color: var(--gold-light);
  }
  .nav-tab .tab-icon { font-size: 16px; display: block; margin-bottom: 2px; }

  /* ── Main content ── */
  .main { padding: 20px 16px 120px; max-width: 480px; margin: 0 auto; }

  /* ── Section header ── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--bark);
  }
  .add-btn {
    background: var(--terracotta);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 8px 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: background 0.2s, transform 0.1s;
    box-shadow: 0 3px 12px rgba(196,113,74,0.35);
  }
  .add-btn:hover { background: #b5623d; }
  .add-btn:active { transform: scale(0.97); }

  /* ── Cards ── */
  .card {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    position: relative;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .card-title { font-weight: 600; font-size: 15px; color: var(--bark); }
  .card-meta { font-size: 12px; color: var(--text-soft); margin-top: 3px; }
  .card-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .card-actions { display: flex; gap: 8px; margin-top: 12px; }
  .card-btn {
    flex: 1;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-soft);
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .card-btn:hover { border-color: var(--terracotta); color: var(--terracotta); }
  .card-btn.danger:hover { border-color: #c0392b; color: #c0392b; }
  .card-btn.success {
    border-color: var(--sage);
    color: var(--sage-dark);
    background: rgba(122,158,126,0.08);
  }

  /* Status badges */
  .badge-pending { background: rgba(212,168,75,0.15); color: #8a6a20; }
  .badge-done { background: rgba(122,158,126,0.15); color: var(--sage-dark); }
  .badge-overdue { background: rgba(192,57,43,0.12); color: #c0392b; }
  .badge-available { background: rgba(106,154,176,0.15); color: #3a6a80; }
  .badge-taken { background: rgba(212,132,122,0.15); color: #9a4a44; }
  .badge-breakfast { background: rgba(212,168,75,0.15); color: #8a6a20; }
  .badge-lunch { background: rgba(122,158,126,0.15); color: var(--sage-dark); }
  .badge-dinner { background: rgba(196,113,74,0.15); color: #7a4020; }

  /* Assignee chip */
  .assignee-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px 3px 6px;
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 8px;
  }
  .assignee-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700;
    color: var(--bark);
  }

  /* Date chip */
  .date-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 6px;
  }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-soft);
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { font-size: 15px; }

  /* ── Modal overlay ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(42,31,22,0.5);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }
  .modal {
    background: var(--warm-white);
    border-radius: 24px 24px 0 0;
    padding: 24px 20px 40px;
    width: 100%;
    max-width: 480px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-overlay.open .modal {
    transform: translateY(0);
  }
  .modal-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 20px;
  }
  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--bark);
    margin-bottom: 20px;
  }

  /* Form */
  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-soft);
    margin-bottom: 6px;
  }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--text);
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    outline: none;
    border-color: var(--terracotta);
  }
  .form-textarea { resize: none; height: 80px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: var(--terracotta);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s;
  }
  .submit-btn:hover { background: #b5623d; }

  /* User selector modal */
  .user-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .user-choice {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 16px 8px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.2s;
    background: var(--cream);
  }
  .user-choice:hover { border-color: var(--terracotta); }
  .user-choice.selected { border-color: var(--terracotta); background: rgba(196,113,74,0.06); }
  .user-choice-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700;
    color: var(--bark);
  }
  .user-choice-name { font-size: 13px; font-weight: 600; color: var(--text); }

  /* Tab panels */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Filter row */
  .filter-row {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .filter-chip {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    color: var(--text-soft);
    transition: all 0.2s;
    background: var(--warm-white);
  }
  .filter-chip.active {
    background: var(--bark);
    border-color: var(--bark);
    color: var(--cream);
  }

  /* Week strip (car) */
  .week-strip {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 16px;
  }
  .day-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 4px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    background: var(--warm-white);
    border: 1.5px solid var(--border);
    transition: all 0.2s;
  }
  .day-cell.selected { border-color: var(--terracotta); background: rgba(196,113,74,0.06); }
  .day-label { font-size: 10px; font-weight: 600; color: var(--text-soft); text-transform: uppercase; }
  .day-num { font-size: 14px; font-weight: 700; color: var(--bark); }
  .day-dot { width: 6px; height: 6px; border-radius: 50%; }
  .dot-taken { background: var(--blush); }
  .dot-available { background: var(--sage); }
  .dot-empty { background: transparent; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bark);
    color: var(--cream);
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* RSVP attendee chips on meal cards */
  .rsvp-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .rsvp-label {
    font-size: 11px;
    color: var(--text-soft);
    font-weight: 500;
  }
  .rsvp-chip {
    width: 24px; height: 24px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700;
    color: var(--bark);
    border: 2px solid white;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }
  .rsvp-btn {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--sage);
    background: rgba(122,158,126,0.08);
    color: var(--sage-dark);
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .rsvp-btn:hover { background: rgba(122,158,126,0.18); }
  .rsvp-btn.rsvp-attending {
    background: var(--sage-dark);
    color: white;
    border-color: var(--sage-dark);
  }

  /* Reminder badge */
  .reminder-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--sky);
    background: rgba(106,154,176,0.12);
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 6px;
  }

  /* ── Refresh bar ── */
  .refresh-bar {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    background: var(--bark);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    z-index: 100;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.15);
  }
  .refresh-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,249,244,0.1);
    border: 1px solid rgba(255,249,244,0.2);
    border-radius: 30px;
    padding: 8px 22px;
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .refresh-btn:hover { background: rgba(255,249,244,0.18); }
  .refresh-btn:active { transform: scale(0.97); }
  .refresh-icon { font-size: 15px; display: inline-block; transition: transform 0.5s; }
  .refresh-icon.spinning { animation: spin 0.6s linear; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .refresh-time { font-size: 11px; color: rgba(255,249,244,0.45); letter-spacing: 0.5px; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div>
      <div class="app-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="28" height="28" style="vertical-align:middle;margin-right:8px;border-radius:7px;"><rect width="180" height="180" rx="40" fill="#2563eb"/><rect x="45" y="95" width="90" height="65" rx="4" fill="white"/><polygon points="30,100 90,45 150,100" fill="white" opacity="0.95"/><rect x="72" y="120" width="36" height="40" rx="4" fill="#2563eb"/><circle cx="103" cy="141" r="3" fill="white"/><rect x="52" y="108" width="22" height="18" rx="3" fill="#93c5fd"/><rect x="106" y="108" width="22" height="18" rx="3" fill="#93c5fd"/><rect x="110" y="52" width="16" height="28" rx="2" fill="white" opacity="0.9"/></svg>Winnie</div>
      <div class="app-subtitle">Family Hub</div>
    </div>
    <div class="user-pill" onclick="openUserModal()">
      <div class="user-avatar" id="headerAvatar" style="background:#d4a84b;">T</div>
      <span class="user-name" id="headerName">Tom</span>
      <span class="chevron">▾</span>
    </div>
  </div>
  <div class="nav-tabs">
    <div class="nav-tab active" onclick="switchTab('chores',this)">
      <span class="tab-icon">🧹</span>Chores
    </div>
    <div class="nav-tab" onclick="switchTab('meals',this)">
      <span class="tab-icon">🍽</span>Meals
    </div>
    <div class="nav-tab" onclick="switchTab('car',this)">
      <span class="tab-icon">🚗</span>Car
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- CHORES TAB -->
  <div id="tab-chores" class="tab-panel active">
    <div class="section-header">
      <div class="section-title">Chores</div>
      <button class="add-btn" onclick="openModal('chore')">+ Add Chore</button>
    </div>
    <div class="filter-row">
      <div class="filter-chip active" onclick="filterChores('all',this)">All</div>
      <div class="filter-chip" onclick="filterChores('pending',this)">Pending</div>
      <div class="filter-chip" onclick="filterChores('done',this)">Done</div>
      <div class="filter-chip" onclick="filterChores('mine',this)">Mine</div>
    </div>
    <div id="chores-list"></div>
  </div>

  <!-- MEALS TAB -->
  <div id="tab-meals" class="tab-panel">
    <div class="section-header">
      <div class="section-title">Meal Menu</div>
      <button class="add-btn" onclick="openModal('meal')">+ Add Meal</button>
    </div>
    <div class="filter-row">
      <div class="filter-chip active" onclick="filterMeals('all',this)">All</div>
      <div class="filter-chip" onclick="filterMeals('breakfast',this)">Breakfast</div>
      <div class="filter-chip" onclick="filterMeals('lunch',this)">Lunch</div>
      <div class="filter-chip" onclick="filterMeals('dinner',this)">Dinner</div>
    </div>
    <div id="meals-list"></div>
  </div>

  <!-- CAR TAB -->
  <div id="tab-car" class="tab-panel">
    <div class="section-header">
      <div class="section-title">Car Schedule</div>
      <button class="add-btn" onclick="openModal('car')">+ Reserve</button>
    </div>
    <div id="week-strip" class="week-strip"></div>
    <div id="car-list"></div>
  </div>

</div><!-- /main -->

<!-- LOADING OVERLAY -->
<div id="loading-overlay" style="display:flex;position:fixed;inset:0;background:rgba(250,247,242,0.92);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
  <div style="font-size:36px">🌿</div>
  <div style="font-family:'DM Sans',sans-serif;font-size:14px;color:#7a6a5e;letter-spacing:1px;">Loading Winnie…</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>


<!-- REFRESH BAR -->
<div class="refresh-bar">
  <button class="refresh-btn" onclick="refreshData()">
    <span class="refresh-icon" id="refreshIcon">↻</span> Refresh
  </button>
  <span class="refresh-time" id="refreshTime">Tap to sync latest data</span>
</div>

<!-- USER MODAL -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Who are you?</div>
    <div class="user-grid" id="userGrid"></div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Add Item</div>
    <div id="modalForm"></div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────
const FAMILY = [
  { name: 'Tom',      color: '#d4a84b', initial: 'T' },
  { name: 'Gracie',   color: '#7a9e7e', initial: 'G' },
  { name: 'Angelina', color: '#c4714a', initial: 'A' },
  { name: 'Louisa',   color: '#6a9ab0', initial: 'L' },
  { name: 'Frankie',  color: '#d4847a', initial: 'F' },
];

let currentUser = FAMILY[0];
let choreFilter = 'all';
let mealFilter  = 'all';
let selectedCarDay = null;
let activeTab = 'chores';
let activeModalType = null;

// ── JSONBin.io Storage ─────────────────────────────────────────
const JSONBIN_KEY = '$2a$10$zWjxoipl3SiLtpcSfhQpbOvWq20DdqL308P1bi1m6EXygeYNkkJsi';
const JSONBIN_URL = 'https://api.jsonbin.io/v3/b';
const BIN_ID = '6a0395f4250b1311c33f0fdf';

async function initBin() {
  // Bin ID is hardcoded — all family devices share the same bin
}


async function refreshData() {
  const icon = document.getElementById('refreshIcon');
  const timeEl = document.getElementById('refreshTime');
  icon.classList.add('spinning');
  await loadAll();
  icon.classList.remove('spinning');
  const now = new Date();
  const t = now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  timeEl.textContent = 'Updated ' + t;
}

async function loadAll() {
  try {
    showLoading(true);
    await initBin();
    const res = await fetch(`${JSONBIN_URL}/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    const data = await res.json();
    chores   = data.record.chores || [];
    meals    = data.record.meals  || [];
    carItems = data.record.car    || [];
  } catch(e) {
    console.error('Load failed:', e);
    chores = []; meals = []; carItems = [];
  } finally {
    showLoading(false);
    render();
  }
}

async function saveAll() {
  try {
    await fetch(`${JSONBIN_URL}/${BIN_ID}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_KEY
      },
      body: JSON.stringify({ chores, meals, car: carItems })
    });
  } catch(e) {
    console.error('Save failed:', e);
    toast('⚠️ Save failed — check connection');
  }
}

function showLoading(on) {
  const el = document.getElementById('loading-overlay');
  if (el) el.style.display = on ? 'flex' : 'none';
}

let chores = [], meals = [], carItems = [];

// ── Render helpers ─────────────────────────────────────────────
function userColor(name) {
  return (FAMILY.find(f=>f.name===name)||{color:'#aaa'}).color;
}
function userInitial(name) {
  return (FAMILY.find(f=>f.name===name)||{initial:'?'}).initial;
}

function avatarHtml(name, size=20) {
  return `<div class="assignee-dot" style="background:${userColor(name)};width:${size}px;height:${size}px;font-size:${Math.round(size*0.48)}px">${userInitial(name)}</div>`;
}

function formatTime(t) {
  if (!t) return '';
  const [hStr, mStr] = t.split(':');
  let h = parseInt(hStr, 10);
  const m = mStr || '00';
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${m} ${ampm}`;
}

function isOverdue(dateStr) {
  if (!dateStr) return false;
  return new Date(dateStr) < new Date(new Date().toDateString());
}

function formatDate(d) {
  if (!d) return '';
  // Parse YYYY-MM-DD directly to avoid UTC-to-local timezone shift
  const [year, month, day] = d.split('-').map(Number);
  const dt = new Date(year, month - 1, day);
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

// ── Chores ─────────────────────────────────────────────────────
function renderChores() {
  const el = document.getElementById('chores-list');
  let list = [...chores];
  if (choreFilter === 'pending') list = list.filter(c=>c.status!=='done');
  if (choreFilter === 'done')    list = list.filter(c=>c.status==='done');
  if (choreFilter === 'mine')    list = list.filter(c=>c.assignee===currentUser.name);

  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">🧹</div><div class="empty-text">No chores here — enjoy the break!</div></div>`;
    return;
  }
  // Sort ascending by due date (undated chores go to the end)
  list.sort((a, b) => {
    if (!a.due && !b.due) return 0;
    if (!a.due) return 1;
    if (!b.due) return -1;
    return new Date(a.due) - new Date(b.due);
  });
    const over = isOverdue(c.due) && c.status !== 'done';
    const badgeClass = c.status==='done' ? 'badge-done' : over ? 'badge-overdue' : 'badge-pending';
    const badgeText  = c.status==='done' ? '✓ Done' : over ? '⚠ Overdue' : 'Pending';
    return `<div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">${c.title}</div>
          ${c.notes ? `<div class="card-meta">${c.notes}</div>` : ''}
        </div>
        <div class="card-badge ${badgeClass}">${badgeText}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;">
        <div class="assignee-chip">${avatarHtml(c.assignee)} ${c.assignee}</div>
        ${c.due ? `<div class="date-chip">📅 Due ${formatDate(c.due)}</div>` : ''}
        ${c.reminder ? `<div class="reminder-tag">🔔 Reminder set</div>` : ''}
      </div>
      <div class="card-actions">
        ${c.status!=='done' ? `<button class="card-btn success" onclick="markDone('chore','${c.id}')">✓ Mark Done</button>` : ''}
        <button class="card-btn danger" onclick="deleteItem('chore','${c.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

// ── Meals ──────────────────────────────────────────────────────
function renderMeals() {
  const el = document.getElementById('meals-list');
  let list = [...meals];
  if (mealFilter !== 'all') list = list.filter(m=>m.type===mealFilter);
  list.sort((a,b)=>new Date(a.date)-new Date(b.date));

  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">🍽</div><div class="empty-text">No meals planned yet.</div></div>`;
    return;
  }
  el.innerHTML = list.map(m => {
    const typeClass = 'badge-'+m.type;
    const cap = m.type.charAt(0).toUpperCase()+m.type.slice(1);
    const attendees = m.attendees || [];
    const isAttending = attendees.includes(currentUser.name);
    const attendeeChips = attendees.map(n =>
      `<div class="rsvp-chip" style="background:${userColor(n)}" title="${n}">${userInitial(n)}</div>`
    ).join('');
    return `<div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">${m.dish}</div>
          ${m.notes ? `<div class="card-meta">${m.notes}</div>` : ''}
        </div>
        <div class="card-badge ${typeClass}">${cap}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;">
        <div class="assignee-chip">${avatarHtml(m.cook)} ${m.cook}</div>
        ${m.date ? `<div class="date-chip">📅 ${formatDate(m.date)}</div>` : ''}
      </div>
      <div class="rsvp-row">
        <span class="rsvp-label">${attendees.length ? 'Attending:' : 'No RSVPs yet'}</span>
        ${attendeeChips}
        <button class="rsvp-btn ${isAttending ? 'rsvp-attending' : ''}" onclick="toggleRsvp('${m.id}')">
          ${isAttending ? '✓ I\'ll be there' : '+ I\'ll attend'}
        </button>
      </div>
      <div class="card-actions">
        <button class="card-btn danger" onclick="deleteItem('meal','${m.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

// ── Car ────────────────────────────────────────────────────────
function renderCar() {
  const strip = document.getElementById('week-strip');
  const today = new Date();
  const days  = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  let html = '';
  for (let i=0; i<7; i++) {
    const d = new Date(today); d.setDate(today.getDate()+i);
    const iso = d.toISOString().split('T')[0];
    const taken = carItems.some(c=>c.date===iso);
    const dayName = days[d.getDay()];
    const dayNum  = d.getDate();
    const sel = selectedCarDay===iso ? 'selected' : '';
    const dot  = taken ? 'dot-taken' : 'dot-available';
    html += `<div class="day-cell ${sel}" onclick="selectDay('${iso}')">
      <span class="day-label">${dayName}</span>
      <span class="day-num">${dayNum}</span>
      <div class="day-dot ${dot}"></div>
    </div>`;
  }
  strip.innerHTML = html;

  const el = document.getElementById('car-list');
  let list = [...carItems].sort((a,b)=>new Date(a.date)-new Date(b.date));
  if (selectedCarDay) list = list.filter(c=>c.date===selectedCarDay);

  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">🚗</div><div class="empty-text">${selectedCarDay?'Car is free this day!':'No reservations yet.'}</div></div>`;
    return;
  }
  el.innerHTML = list.map(c => {
    const badgeClass = c.status==='returned' ? 'badge-done' : 'badge-taken';
    const badgeText  = c.status==='returned' ? '✓ Returned' : '🔑 Reserved';
    return `<div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">${c.purpose}</div>
          ${c.time ? `<div class="card-meta">⏰ Leaving ${formatTime(c.time)}${c.returnTime ? ` &nbsp;·&nbsp; 🏠 Back by ${formatTime(c.returnTime)}` : ''}</div>` : ''}
        </div>
        <div class="card-badge ${badgeClass}">${badgeText}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:8px;">
        <div class="assignee-chip">${avatarHtml(c.driver)} ${c.driver}</div>
        <div class="date-chip">📅 ${formatDate(c.date)}</div>
      </div>
      <div class="card-actions">
        ${c.status!=='returned' ? `<button class="card-btn success" onclick="markDone('car','${c.id}')">✓ Returned</button>` : ''}
        <button class="card-btn danger" onclick="deleteItem('car','${c.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

function selectDay(iso) {
  selectedCarDay = selectedCarDay === iso ? null : iso;
  renderCar();
}

// ── Render all ─────────────────────────────────────────────────
function render() {
  renderChores();
  renderMeals();
  renderCar();
  updateHeader();
}

function updateHeader() {
  document.getElementById('headerAvatar').textContent = currentUser.initial;
  document.getElementById('headerAvatar').style.background = currentUser.color;
  document.getElementById('headerName').textContent = currentUser.name;
}

// ── Tab switching ──────────────────────────────────────────────
function switchTab(tab, el) {
  activeTab = tab;
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  el.classList.add('active');
}

// ── Filters ────────────────────────────────────────────────────
function filterChores(f, el) {
  choreFilter = f;
  document.querySelectorAll('#tab-chores .filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderChores();
}
function filterMeals(f, el) {
  mealFilter = f;
  document.querySelectorAll('#tab-meals .filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderMeals();
}

// ── User modal ─────────────────────────────────────────────────
function openUserModal() {
  const grid = document.getElementById('userGrid');
  grid.innerHTML = FAMILY.map(u => `
    <div class="user-choice ${u.name===currentUser.name?'selected':''}" onclick="selectUser('${u.name}')">
      <div class="user-choice-avatar" style="background:${u.color}">${u.initial}</div>
      <div class="user-choice-name">${u.name}</div>
    </div>
  `).join('');
  document.getElementById('userModal').classList.add('open');
}
function selectUser(name) {
  currentUser = FAMILY.find(f=>f.name===name);
  closeModals();
  render();
  toast(`Hi, ${currentUser.name}! 👋`);
}

// ── Add modal ──────────────────────────────────────────────────
function openModal(type) {
  activeModalType = type;
  const titles = {chore:'Add a Chore',meal:'Plan a Meal',car:'Reserve the Car'};
  document.getElementById('modalTitle').textContent = titles[type];

  const memberOptions = FAMILY.map(f=>`<option value="${f.name}" ${f.name===currentUser.name?'selected':''}>${f.name}</option>`).join('');
  const today = new Date().toISOString().split('T')[0];

  let form = '';
  if (type === 'chore') {
    form = `
      <div class="form-group">
        <label class="form-label">Chore</label>
        <input class="form-input" id="f-title" placeholder="e.g. Vacuum living room" />
      </div>
      <div class="form-group">
        <label class="form-label">Notes (optional)</label>
        <textarea class="form-textarea" id="f-notes" placeholder="Any details..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Assigned to</label>
          <select class="form-select" id="f-assignee">${memberOptions}</select>
        </div>
        <div class="form-group">
          <label class="form-label">Due date</label>
          <input class="form-input" type="date" id="f-due" value="${today}" min="${today}" />
        </div>
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:10px;">
        <input type="checkbox" id="f-reminder" style="width:18px;height:18px;accent-color:var(--terracotta)" />
        <label for="f-reminder" style="font-size:14px;color:var(--text)">Remind me when this is due <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:rgba(106,154,176,0.15);color:#3a6a80;margin-left:4px;">Coming Soon</span></label>
      </div>
      <button class="submit-btn" onclick="submitItem()">Add Chore</button>
    `;
  } else if (type === 'meal') {
    form = `
      <div class="form-group">
        <label class="form-label">Dish name</label>
        <input class="form-input" id="f-dish" placeholder="e.g. Pasta Carbonara" />
      </div>
      <div class="form-group">
        <label class="form-label">Notes (optional)</label>
        <textarea class="form-textarea" id="f-notes" placeholder="Ingredients, allergies..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Meal type</label>
          <select class="form-select" id="f-type">
            <option value="breakfast">🌅 Breakfast</option>
            <option value="lunch">☀️ Lunch</option>
            <option value="dinner" selected>🌙 Dinner</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Date</label>
          <input class="form-input" type="date" id="f-date" value="${today}" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Cook</label>
        <select class="form-select" id="f-cook">${memberOptions}</select>
      </div>
      <button class="submit-btn" onclick="submitItem()">Add Meal</button>
    `;
  } else if (type === 'car') {
    form = `
      <div class="form-group">
        <label class="form-label">Purpose</label>
        <input class="form-input" id="f-purpose" placeholder="e.g. Grocery run, doctor appt" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Date</label>
          <input class="form-input" type="date" id="f-date" value="${selectedCarDay||today}" />
        </div>
        <div class="form-group">
          <label class="form-label">Leaving at</label>
          <input class="form-input" type="time" id="f-time" value="09:00" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Back by</label>
          <input class="form-input" type="time" id="f-return" value="12:00" />
        </div>
        <div class="form-group">
          <label class="form-label">Driver</label>
          <select class="form-select" id="f-driver">${memberOptions}</select>
        </div>
      </div>
      <button class="submit-btn" onclick="submitItem()">Reserve Car</button>
    `;
  }

  document.getElementById('modalForm').innerHTML = form;
  document.getElementById('addModal').classList.add('open');
}

function submitItem() {
  const id = Date.now().toString();
  if (activeModalType === 'chore') {
    const title = document.getElementById('f-title').value.trim();
    if (!title) { toast('Please enter a chore name'); return; }
    chores.push({
      id, title,
      notes: document.getElementById('f-notes').value.trim(),
      assignee: document.getElementById('f-assignee').value,
      due: document.getElementById('f-due').value,
      reminder: document.getElementById('f-reminder').checked,
      status: 'pending',
      createdBy: currentUser.name
    });
    saveAll();
    toast('Chore added! 🧹');
  } else if (activeModalType === 'meal') {
    const dish = document.getElementById('f-dish').value.trim();
    if (!dish) { toast('Please enter a dish name'); return; }
    meals.push({
      id, dish,
      notes: document.getElementById('f-notes').value.trim(),
      type: document.getElementById('f-type').value,
      date: document.getElementById('f-date').value,
      cook: document.getElementById('f-cook').value,
      createdBy: currentUser.name
    });
    saveAll();
    toast('Meal planned! 🍽');
  } else if (activeModalType === 'car') {
    const purpose = document.getElementById('f-purpose').value.trim();
    if (!purpose) { toast('Please enter a purpose'); return; }
    const date = document.getElementById('f-date').value;
    const newStart = document.getElementById('f-time').value;
    const newEnd   = document.getElementById('f-return').value;

    // Check for time overlap on same day
    const toMins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
    const overlapping = carItems.filter(c => c.date === date && c.status !== 'returned').filter(c => {
      if (!c.time || !c.returnTime || !newStart || !newEnd) return false;
      const eStart = toMins(c.time), eEnd = toMins(c.returnTime);
      const nStart = toMins(newStart),  nEnd  = toMins(newEnd);
      return nStart < eEnd && nEnd > eStart;
    });
    if (overlapping.length > 0) {
      const msg = overlapping.map(c => `${c.driver} (${formatTime(c.time)}–${formatTime(c.returnTime)})`).join(', ');
      if (!confirm(`⚠️ Overlapping reservation exists:\n${msg}\n\nAdd your reservation anyway?`)) return;
    }
    carItems.push({
      id, purpose, date,
      time: document.getElementById('f-time').value,
      returnTime: document.getElementById('f-return').value,
      driver: document.getElementById('f-driver').value,
      status: 'reserved',
      createdBy: currentUser.name
    });
    saveAll();
    toast('Car reserved! 🚗');
  }
  closeModals();
  render();
}

// ── Item actions ───────────────────────────────────────────────
function markDone(type, id) {
  if (type === 'chore') {
    const c = chores.find(x=>x.id===id);
    if (c) c.status = 'done';
    saveAll();
    toast('Great job! ✅');
  } else if (type === 'car') {
    const c = carItems.find(x=>x.id===id);
    if (c) c.status = 'returned';
    saveAll();
    toast('Car returned! 🗝');
  }
  render();
}

function deleteItem(type, id) {
  if (type === 'chore')  { chores   = chores.filter(x=>x.id!==id);   saveAll(); }
  if (type === 'meal')   { meals    = meals.filter(x=>x.id!==id);     saveAll(); }
  if (type === 'car')    { carItems = carItems.filter(x=>x.id!==id);  saveAll(); }
  render();
  toast('Item removed');
}

function toggleRsvp(mealId) {
  const m = meals.find(x => x.id === mealId);
  if (!m) return;
  if (!m.attendees) m.attendees = [];
  const idx = m.attendees.indexOf(currentUser.name);
  if (idx === -1) {
    m.attendees.push(currentUser.name);
    toast(`${currentUser.name} is attending! 🍽`);
  } else {
    m.attendees.splice(idx, 1);
    toast('RSVP removed');
  }
  saveAll();
  renderMeals();
}

// ── Modal close ────────────────────────────────────────────────
function closeModals() {
  document.querySelectorAll('.modal-overlay').forEach(m=>m.classList.remove('open'));
}
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => { if (e.target===overlay) closeModals(); });
});

// ── Toast ──────────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2200);
}

// ── Boot ───────────────────────────────────────────────────────
loadAll();
</script>
</body>
</html>
